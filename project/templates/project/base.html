<!-- Base template for the stock portfolio tracker application. -->
<!DOCTYPE html>
<html>
<head>
    <title>Stock Portfolio Tracker</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        nav { background: #1a1a2e; padding: 10px 20px; }
        nav a { color: white; margin-right: 15px; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 900px; margin: 30px auto; background: white; padding: 20px; border-radius: 8px; }
        h1, h2 { color: #1a1a2e; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #1a1a2e; color: white; }
        tr:nth-child(even) { background: #f9f9f9; }
        a { color: #1a1a2e; }
        .btn { background: #1a1a2e; color: white; padding: 8px 14px; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; }
        .btn:hover { background: #16213e; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'main' %}">Home</a>
        <a href="{% url 'stock-list' %}">Stocks</a>
        {% if request.user.is_authenticated %}
            {% if profile_pk %}
                <a href="{% url 'profile-detail' profile_pk %}">My Profile</a>
            {% endif %}
            <form method="post" action="{% url 'logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" style="background:none; border:none; color:white; cursor:pointer; font-size:1em;">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>
        {% endif %}
    </nav>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
