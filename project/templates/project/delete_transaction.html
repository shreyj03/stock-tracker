<!-- Confirmation page for deleting a transaction. -->
{% extends 'project/base.html' %}
{% block content %}
<h1>Delete Transaction</h1>
<p>Are you sure you want to delete this transaction: <strong>{{ transaction.transaction_type }} {{ transaction.quantity }} x {{ transaction.stock.ticker }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn" style="background:red;">Delete</button>
    <a href="{% url 'profile-detail' request.user.project_profile.pk %}" style="margin-left:10px;">Cancel</a>
</form>
{% endblock %}
