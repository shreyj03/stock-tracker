<!-- Confirmation page for removing a stock from the watchlist. -->
{% extends 'project/base.html' %}
{% block content %}
<h1>Remove from Watchlist</h1>
<p>Are you sure you want to remove <strong>{{ watchlist.stock.ticker }}</strong> from your watchlist?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn" style="background:red;">Remove</button>
    <a href="{% url 'profile-detail' request.user.project_profile.pk %}" style="margin-left:10px;">Cancel</a>
</form>
{% endblock %}
